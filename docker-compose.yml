services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pwf_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pwf_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: pwf_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pwf_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: pwf_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: project-pwf
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - pwf_db_data:/var/lib/mysql
    networks:
      - pwf_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pwf_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - pwf_network
    depends_on:
      - db

networks:
  pwf_network:
    driver: bridge

volumes:
  pwf_db_data:
    driver: local